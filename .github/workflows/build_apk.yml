name: Unzip & Build Jerood APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Code
        run: |
          mkdir -p extracted
          unzip -o jerood_app-1.zip -d extracted
          # نقل كافة الملفات إلى المجلد الجذري للمشروع
          cp -r extracted/* . 2>/dev/null || true
          cp -r extracted/jerood_flutter_app/* . 2>/dev/null || true

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jerood-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
